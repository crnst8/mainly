name: ci

# The same gate ./dev.sh check runs locally: typecheck across three workspaces,
# the dependency audit, the contract hash, the two executable-spec suites, unit
# tests, then smoke and query correctness against a real Postgres.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reads the repo and nothing else. release.yml scopes each of its jobs already;
# without this one, CI ran on whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mainly
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mainly
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U mainly -d mainly"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://mainly:ci@localhost:54329/mainly
      SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SESSION_SECRET: ci-session-secret
      APP_ORIGIN: http://localhost:5273
      HOST: 127.0.0.1
      PORT: '5274'
      ROLE: all
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            mcp/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: mcp

      - name: Typecheck
        run: |
          (cd frontend && npx tsc -b --noEmit)
          (cd backend  && npx tsc -b --noEmit)
          (cd mcp      && npx tsc -b --noEmit)

      # Advisories, not freshness: high in the runtime tree fails, dev-only warns.
      # Waivers live in .github/audit-allowlist.json.
      - name: Audit
        run: node scripts/audit-check.mjs

      # The one thing that makes the duplicated contract safe.
      - name: Contract
        run: node scripts/check-contract.mjs
        working-directory: backend

      - name: Executable specs
        run: |
          node scripts/url-check.mjs
          node scripts/search-check.mjs
        working-directory: frontend

      # No Postgres needed: these build the app and inject, so they belong with
      # the fast checks rather than behind the service container.
      - name: SPA serving and login limits
        run: |
          node --experimental-strip-types scripts/static-check.mjs
          node --experimental-strip-types scripts/auth-check.mjs
        working-directory: backend

      - name: Unit tests
        run: npm test
        working-directory: backend

      - name: Migrate and seed
        run: |
          npm run migrate
          node --experimental-strip-types src/cli/seed.ts
        working-directory: backend

      # Reseeded above on purpose: the query checks assert absolute counts and
      # the smoke run mutates flags and moves messages.
      - name: Smoke and query correctness
        run: |
          api_log="$RUNNER_TEMP/mainly-api.log"
          node --experimental-strip-types src/server.ts >"$api_log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5274/api/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$api_log"
            exit 1
          fi

          node scripts/smoke.mjs
          node scripts/query-check.mjs
          node scripts/index-check.mjs
        working-directory: backend

      - name: Build
        run: |
          (cd frontend && npm run build)
          (cd backend  && npm run build)
