<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Mainly</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- PNG fallback for the browsers and platforms that ignore SVG icons. -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preload" href="/fonts/NeueHaasTextRegular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/NeueHaasTextMedium.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Paint the stored theme before first frame — no flash, no jump.
      try {
        var t = JSON.parse(localStorage.getItem('mail.theme') || '{}');
        var r = document.documentElement;
        if (t.mode) r.dataset.theme = t.mode === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : t.mode;
        if (t.accent) r.style.setProperty('--accent', t.accent);
        if (t.density) r.dataset.density = t.density;
        if (t.radius != null) r.style.setProperty('--radius', t.radius + 'px');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
